name: HQ Tradutor Serie V9 Watchdog

on:
  push:
    paths:
      - '.github/workflows/apk-serie-v9.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Criar projeto V9 Watchdog
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/hqv9.tar.xz
          echo "25ac700a7bdf8176d418cb226f04802e0483e77a3f4171bc36f483c17a015d97  /tmp/hqv9.tar.xz" | sha256sum -c -
          tar -xJf /tmp/hqv9.tar.xz
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > HQTradutorV9/gradle.properties
          test -f HQTradutorV9/app/src/main/java/com/hqtradutor/app/MainActivity.java
          test -f HQTradutorV9/app/build.gradle

      - name: Revisar watchdog e limpeza V9
        shell: bash
        run: |
          set -euo pipefail
          SRC="HQTradutorV9/app/src/main/java/com/hqtradutor/app/MainActivity.java"
          MANIFEST="HQTradutorV9/app/src/main/AndroidManifest.xml"
          GRADLE="HQTradutorV9/app/build.gradle"
          PROPS="HQTradutorV9/gradle.properties"
          grep -q "android.useAndroidX=true" "$PROPS"
          grep -q "ACCESS_NETWORK_STATE" "$MANIFEST"
          grep -q "NET_CAPABILITY_VALIDATED" "$SRC"
          grep -q "startWatchdog" "$SRC"
          grep -q "watchdogTick" "$SRC"
          grep -q "recoverStalledDownload" "$SRC"
          grep -q "softResetCurrentChapter" "$SRC"
          grep -q "COLUMN_BYTES_DOWNLOADED_SO_FAR" "$SRC"
          grep -q "download ficou sem progresso" "$SRC"
          grep -q "CAPTURE_RELOAD" "$SRC"
          grep -q "checkpoint_page_" "$SRC"
          grep -q "isPageAlreadySaved" "$SRC"
          grep -q "createChapterPdfFromUris" "$SRC"
          grep -q "validateSavedPdf" "$SRC"
          grep -q "deleteChapterImageUris" "$SRC"
          grep -q "imagens excluídas" "$SRC"
          grep -q "TextRecognition.getClient" "$SRC"
          grep -q "translator.translate" "$SRC"
          grep -q "versionCode 9" "$GRADLE"
          echo "Revisao V9 OK: watchdog de travamento + progresso real do DownloadManager + soft reset do capítulo + checkpoint + PDF validado + exclusao dos JPGs."

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK V9
        working-directory: HQTradutorV9
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Conferir APK V9
        shell: bash
        run: |
          set -euo pipefail
          APK="HQTradutorV9/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          rm -f /tmp/classes*.dex /tmp/apk-strings.txt
          for f in classes.dex classes2.dex classes3.dex classes4.dex; do
            unzip -p "$APK" "$f" > "/tmp/$f" 2>/dev/null || true
          done
          cat /tmp/classes*.dex 2>/dev/null | strings > /tmp/apk-strings.txt || true
          grep -q "HQ Tradutor V9" /tmp/apk-strings.txt
          grep -q "Recuperação automática" /tmp/apk-strings.txt
          grep -q "watchdog" /tmp/apk-strings.txt
          grep -q "imagens excluídas" /tmp/apk-strings.txt
          grep -q "TextRecognition" /tmp/apk-strings.txt
          grep -q "PdfDocument" /tmp/apk-strings.txt
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Publicar APK V9
        uses: actions/upload-artifact@v4
        with:
          name: HQTradutor-SERIE-V9-WATCHDOG-APK
          path: HQTradutorV9/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
