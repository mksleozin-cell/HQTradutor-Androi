name: HQ Tradutor Browser Capture FIX v4
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Projeto v4
        shell: bash
        run: |
          cat >/tmp/hq.b64 <<'DATA'
          
          DATA
          base64 -d /tmp/hq.b64 >/tmp/hq.tar.xz
          tar -xJf /tmp/hq.tar.xz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - working-directory: HQTradutor_v2
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HQTradutor-BROWSER-CAPTURE-FIX-V4-APK
          path: HQTradutor_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
