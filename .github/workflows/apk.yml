name: Gerar APK HQ Tradutor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ler repositório
        uses: actions/checkout@v4

      - name: Recuperar projeto do build.yml
        shell: bash
        run: |
          sed -n "/<<'HQTRADUTOR_B64'/,/^[[:space:]]*HQTRADUTOR_B64[[:space:]]*$/p" .github/workflows/build.yml \
            | sed '1d;$d;s/^[[:space:]]*//' > /tmp/hqtradutor.b64
          base64 --decode /tmp/hqtradutor.b64 > /tmp/HQTradutor-Android.zip
          unzip -q /tmp/HQTradutor-Android.zip -d "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/HQTradutor/app/build.gradle"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        working-directory: HQTradutor
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: cp HQTradutor/app/build/outputs/apk/debug/app-debug.apk HQTradutor.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: HQTradutor-APK
          path: HQTradutor.apk
          if-no-files-found: error
          retention-days: 7
          
