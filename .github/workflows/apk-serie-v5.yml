      - name: Revisao automatica da estrutura
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hqtradutor/app/MainActivity.java
          grep -q 'Downloads/' app/src/main/java/com/hqtradutor/app/MainActivity.java
          grep -q 'Capítulo ' app/src/main/java/com/hqtradutor/app/MainActivity.java
          grep -q 'chapter-' app/src/main/java/com/hqtradutor/app/MainActivity.java
          grep -q 'setDestinationInExternalPublicDir' app/src/main/java/com/hqtradutor/app/MainActivity.java
          echo 'Estrutura V5 validada.'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Conferir APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: HQTradutor-SERIE-V5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
