name: HQ Tradutor Serie V7 Recovery

on:
  push:
    paths:
      - '.github/workflows/apk-serie-v7.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Criar projeto V7 Recovery
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/hqv7.tar.xz
          echo "15e98a35057ede9060ebbf071a9391581b05a9fc0e6e33d8f14dbc07c3282602  /tmp/hqv7.tar.xz" | sha256sum -c -
          tar -xJf /tmp/hqv7.tar.xz
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > HQTradutorV7/gradle.properties
          test -f HQTradutorV7/app/src/main/java/com/hqtradutor/app/MainActivity.java
          test -f HQTradutorV7/app/build.gradle

      - name: Revisar recuperacao automatica
        shell: bash
        run: |
          set -euo pipefail
          SRC="HQTradutorV7/app/src/main/java/com/hqtradutor/app/MainActivity.java"
          MANIFEST="HQTradutorV7/app/src/main/AndroidManifest.xml"
          GRADLE="HQTradutorV7/app/build.gradle"
          PROPS="HQTradutorV7/gradle.properties"
          grep -q "android.useAndroidX=true" "$PROPS"
          grep -q "ACCESS_NETWORK_STATE" "$MANIFEST"
          grep -q "registerDefaultNetworkCallback" "$SRC"
          grep -q "NET_CAPABILITY_VALIDATED" "$SRC"
          grep -q "waitForNetwork" "$SRC"
          grep -q "handleNetworkReturned" "$SRC"
          grep -q "run_active_" "$SRC"
          grep -q "checkpoint_page_" "$SRC"
          grep -q "isPageAlreadySaved" "$SRC"
          grep -q "active_download_" "$SRC"
          grep -q "listTranslatedDownloadUrisForCurrentChapter" "$SRC"
          grep -q "createChapterPdfFromUris" "$SRC"
          grep -q "TextRecognition.getClient" "$SRC"
          grep -q "translator.translate" "$SRC"
          grep -q "versionCode 7" "$GRADLE"
          echo "Revisao V7 OK: reconexao + checkpoint por pagina + fila persistente + skip de arquivos prontos + PDF retomavel."

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK V7
        working-directory: HQTradutorV7
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Conferir APK V7
        shell: bash
        run: |
          set -euo pipefail
          APK="HQTradutorV7/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          rm -f /tmp/classes*.dex /tmp/apk-strings.txt
          for f in classes.dex classes2.dex classes3.dex classes4.dex; do
            unzip -p "$APK" "$f" > "/tmp/$f" 2>/dev/null || true
          done
          cat /tmp/classes*.dex 2>/dev/null | strings > /tmp/apk-strings.txt || true
          grep -q "HQ Tradutor V7" /tmp/apk-strings.txt
          grep -q "Sem internet" /tmp/apk-strings.txt
          grep -q "checkpoint" /tmp/apk-strings.txt
          grep -q "TextRecognition" /tmp/apk-strings.txt
          grep -q "PdfDocument" /tmp/apk-strings.txt
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Publicar APK V7
        uses: actions/upload-artifact@v4
        with:
          name: HQTradutor-SERIE-V7-RECOVERY-APK
          path: HQTradutorV7/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
