name: HQ Tradutor Serie V6 Completo

on:
  push:
    paths:
      - '.github/workflows/apk-serie-v6.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Criar projeto V6 completo
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/hqv6.tar.xz
          echo "819533695ee54bb2ed6816218c53581e86495b8527a13d62e11bbf6698dcce40  /tmp/hqv6.tar.xz" | sha256sum -c -
          tar -xJf /tmp/hqv6.tar.xz
          test -f HQTradutorV6/app/src/main/java/com/hqtradutor/app/MainActivity.java
          test -f HQTradutorV6/app/build.gradle

      - name: Revisar recursos obrigatorios
        shell: bash
        run: |
          set -euo pipefail
          SRC="HQTradutorV6/app/src/main/java/com/hqtradutor/app/MainActivity.java"
          GRADLE="HQTradutorV6/app/build.gradle"
          grep -q "Baixar e traduzir HQ inteira" "$SRC"
          grep -q "/manga/" "$SRC"
          grep -q "chapters.sort" "$SRC"
          grep -q "injectChapterCollector" "$SRC"
          grep -q "data-lazy-src" "$SRC"
          grep -q "TextRecognition.getClient" "$SRC"
          grep -q "translator.translate" "$SRC"
          grep -q "PdfDocument" "$SRC"
          grep -q "PT-BR.pdf" "$SRC"
          grep -q "RELATIVE_PATH" "$SRC"
          grep -q "com.google.mlkit:text-recognition:16.0.1" "$GRADLE"
          grep -q "com.google.mlkit:translate:17.0.3" "$GRADLE"
          grep -q "versionCode 6" "$GRADLE"
          echo "Revisao V6 OK: serie + lazy-load + OCR + traducao + PDF + pasta unica."

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK V6
        working-directory: HQTradutorV6
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Conferir APK V6
        shell: bash
        run: |
          set -euo pipefail
          APK="HQTradutorV6/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          rm -f /tmp/classes*.dex /tmp/apk-strings.txt
          for f in classes.dex classes2.dex classes3.dex classes4.dex; do
            unzip -p "$APK" "$f" > "/tmp/$f" 2>/dev/null || true
          done
          cat /tmp/classes*.dex 2>/dev/null | strings > /tmp/apk-strings.txt || true
          grep -q "HQ Tradutor V6" /tmp/apk-strings.txt
          grep -q "TextRecognition" /tmp/apk-strings.txt
          grep -q "PdfDocument" /tmp/apk-strings.txt
          grep -q "Baixar e traduzir HQ inteira" /tmp/apk-strings.txt
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Publicar APK V6
        uses: actions/upload-artifact@v4
        with:
          name: HQTradutor-SERIE-V6-COMPLETO-APK
          path: HQTradutorV6/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
