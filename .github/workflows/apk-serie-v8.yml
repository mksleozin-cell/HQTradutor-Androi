name: HQ Tradutor Serie V8 Resilient

on:
  push:
    paths:
      - '.github/workflows/apk-serie-v8.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Criar projeto V8 Resilient
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/hqv8.tar.xz
          echo "e0bbd02efee22b64e2eb55bd114f86e8650b6419ed3fc60e5b16717c2a3e193d  /tmp/hqv8.tar.xz" | sha256sum -c -
          tar -xJf /tmp/hqv8.tar.xz
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > HQTradutorV8/gradle.properties
          test -f HQTradutorV8/app/src/main/java/com/hqtradutor/app/MainActivity.java
          test -f HQTradutorV8/app/build.gradle

      - name: Revisar recuperacao V8
        shell: bash
        run: |
          set -euo pipefail
          SRC="HQTradutorV8/app/src/main/java/com/hqtradutor/app/MainActivity.java"
          MANIFEST="HQTradutorV8/app/src/main/AndroidManifest.xml"
          GRADLE="HQTradutorV8/app/build.gradle"
          PROPS="HQTradutorV8/gradle.properties"
          grep -q "android.useAndroidX=true" "$PROPS"
          grep -q "ACCESS_NETWORK_STATE" "$MANIFEST"
          grep -q "registerDefaultNetworkCallback" "$SRC"
          grep -q "NET_CAPABILITY_VALIDATED" "$SRC"
          grep -q "checkpoint_page_" "$SRC"
          grep -q "isPageAlreadySaved" "$SRC"
          grep -q "active_download_" "$SRC"
          grep -q "directCircuitOpen" "$SRC"
          grep -q "startInDocumentCapture" "$SRC"
          grep -q "captureBrowserDocumentToBitmap" "$SRC"
          grep -q "mudando imediatamente para o navegador interno" "$SRC"
          grep -q "pageRetryCount <= 2" "$SRC"
          grep -q "nenhuma página concluída será refeita" "$SRC"
          grep -q "TextRecognition.getClient" "$SRC"
          grep -q "translator.translate" "$SRC"
          grep -q "createChapterPdfFromUris" "$SRC"
          grep -q "versionCode 8" "$GRADLE"
          echo "Revisao V8 OK: circuit breaker + captura na sessao original + reconexao + checkpoint + skip de paginas salvas."

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK V8
        working-directory: HQTradutorV8
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Conferir APK V8
        shell: bash
        run: |
          set -euo pipefail
          APK="HQTradutorV8/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          rm -f /tmp/classes*.dex /tmp/apk-strings.txt
          for f in classes.dex classes2.dex classes3.dex classes4.dex; do
            unzip -p "$APK" "$f" > "/tmp/$f" 2>/dev/null || true
          done
          cat /tmp/classes*.dex 2>/dev/null | strings > /tmp/apk-strings.txt || true
          grep -q "HQ Tradutor V8" /tmp/apk-strings.txt
          grep -q "navegador interno" /tmp/apk-strings.txt
          grep -q "checkpoint" /tmp/apk-strings.txt
          grep -q "TextRecognition" /tmp/apk-strings.txt
          grep -q "PdfDocument" /tmp/apk-strings.txt
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Publicar APK V8
        uses: actions/upload-artifact@v4
        with:
          name: HQTradutor-SERIE-V8-RESILIENT-APK
          path: HQTradutorV8/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
