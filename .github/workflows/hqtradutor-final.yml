name: HQ Tradutor FINAL V13

on:
  push:
    paths:
      - '.github/workflows/hqtradutor-final.yml'
      - '.github/workflows/hqtradutor-final.part*'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Conferir as 5 partes
        id: parts
        shell: bash
        run: |
          set -euo pipefail
          READY=true
          for n in 00 01 02 03 04; do
            FILE=".github/workflows/hqtradutor-final.part${n}"
            if [ ! -s "$FILE" ]; then
              echo "Ainda falta: $FILE"
              READY=false
            fi
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" = false ]; then
            echo "As partes ainda não foram todas enviadas. Este run termina sem erro; o último upload iniciará a compilação."
          fi

      - name: Reconstruir projeto V13
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/workflows/hqtradutor-final.part00 \
              .github/workflows/hqtradutor-final.part01 \
              .github/workflows/hqtradutor-final.part02 \
              .github/workflows/hqtradutor-final.part03 \
              .github/workflows/hqtradutor-final.part04 > /tmp/HQTradutorV13-final.tar.xz
          echo "dfe5aee687139b344fe8dc0bdc01c05fea6c83cbedbbf212e0d6721016f1983c  /tmp/HQTradutorV13-final.tar.xz" | sha256sum -c -
          tar -xJf /tmp/HQTradutorV13-final.tar.xz
          test -s HQTradutorV13/app/src/main/java/com/hqtradutor/app/MainActivity.java
          test -s HQTradutorV13/app/src/main/java/com/hqtradutor/app/ProcessingService.java
          test -s HQTradutorV13/app/src/main/java/com/hqtradutor/app/DiagnosticLog.java

      - name: Corrigir helper OCR V13
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path("HQTradutorV13/app/src/main/java/com/hqtradutor/app/MainActivity.java")
          s = p.read_text(encoding="utf-8")
          if "class DetectedBlock" not in s:
              marker = "    private final class Chapter {"
              lines = [
                  "    private static final class DetectedBlock {",
                  "        final Rect box;",
                  "        final String original;",
                  "",
                  "        DetectedBlock(Rect box, String original) {",
                  "            this.box = box;",
                  "            this.original = original;",
                  "        }",
                  "    }",
                  "",
              ]
              helper = "\n".join(lines) + "\n"
              if marker not in s:
                  raise SystemExit("Ponto de inserção do helper OCR não encontrado")
              s = s.replace(marker, helper + marker, 1)
              p.write_text(s, encoding="utf-8")
          if "private static final class DetectedBlock" not in p.read_text(encoding="utf-8"):
              raise SystemExit("Helper OCR DetectedBlock não foi aplicado")
          print("Helper OCR DetectedBlock OK")
          PYFIX

      - name: Auditoria de segurança e retomada
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SRC="HQTradutorV13/app/src/main/java/com/hqtradutor/app/MainActivity.java"
          SVC="HQTradutorV13/app/src/main/java/com/hqtradutor/app/ProcessingService.java"
          MAN="HQTradutorV13/app/src/main/AndroidManifest.xml"
          GRADLE="HQTradutorV13/app/build.gradle"
          grep -q 'versionCode 13' "$GRADLE"
          grep -q 'HQ Tradutor V13' "$SRC"
          grep -q 'SAVED_V13' "$SRC"
          grep -q 'private static final class DetectedBlock' "$SRC"
          grep -q 'CAPTURE_ISOLATED' "$SRC"
          grep -q 'activeCaptureToken' "$SRC"
          grep -q 'fingerprintDistance' "$SRC"
          grep -q 'sameFingerprint >= 3' "$SRC"
          grep -q 'expectedHint' "$SRC"
          grep -q 'completed_page_count_' "$SRC"
          grep -q 'recoverStalledDownload' "$SRC"
          grep -q 'PAGE_DEFERRED' "$SRC"
          grep -q 'startPrefetchNextPage' "$SRC"
          grep -q 'translationBatchSize' "$SRC"
          grep -q 'validateSavedPdf' "$SRC"
          grep -q 'PdfRenderer' "$SRC"
          grep -q 'deleteChapterImageUris' "$SRC"
          grep -q 'cleanupResidualImagesForCompletedChapter' "$SRC"
          grep -q 'TextRecognition.getClient' "$SRC"
          grep -q 'translator.translate' "$SRC"
          grep -q 'NET_CAPABILITY_VALIDATED' "$SRC"
          grep -q 'startForeground' "$SVC"
          grep -q 'PARTIAL_WAKE_LOCK' "$SVC"
          grep -q 'WIFI_MODE_FULL_HIGH_PERF' "$SVC"
          grep -q 'recovery_pending' "$SVC"
          grep -q 'FOREGROUND_SERVICE_SPECIAL_USE' "$MAN"
          grep -q 'POST_NOTIFICATIONS' "$MAN"
          echo 'Auditoria V13 OK.'

      - name: Java 17
        if: steps.parts.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        if: steps.parts.outputs.ready == 'true'
        uses: android-actions/setup-android@v3

      - name: Android 35
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        if: steps.parts.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK FINAL V13
        if: steps.parts.outputs.ready == 'true'
        working-directory: HQTradutorV13
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Conferir APK FINAL V13
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="HQTradutorV13/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'resources.arsc'
          unzip -l "$APK" | grep -q 'classes.dex'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.hqtradutor.app'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='13'"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Publicar APK FINAL V13
        if: steps.parts.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HQTradutor-FINAL-V13-APK
          path: HQTradutorV13/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
